function goreliSaat(x){var t=ms(x);if(!t)return '-';var d=new Date(t),simdi=new Date(),fark=simdi.getTime()-t;

/* Cevap ayrıştırma: RAPOR / SORU / ÖĞRENDİM (ortak.ts cevapAyristir) */
function cevapAyristir(metin){var ham=metin||'';var re=/^[ \t]*(RAPOR|SORU|ÖĞRENDİM|OGRENDIM)[ \t]*:[ \t]*/gim;var es=[],m;
  while((m=re.exec(ham))){es.push({tip:m[1].toLocaleUpperCase('tr-TR'),bas:m.index,son:m.index+m[0].length});}
  if(!es.length)return {rapor:'',sorular:[],ogrenilen:[],ham:ham};
  var rp=[],sorular=[],ogr=[];var bastaki=ham.slice(0,es[0].bas).trim();if(bastaki)rp.push(bastaki);
  es.forEach(function(e,i){var g=ham.slice(e.son,i+1<es.length?es[i+1].bas:undefined).trim();if(!g)return;
    if(e.tip==='RAPOR')rp.push(g);else if(e.tip==='SORU')sorular.push(g);else{g.split('\n').forEach(function(s){var t=s.replace(/^\s*[-•*\d.)]+\s*/,'').trim();if(t)ogr.push(t);});}});
  return {rapor:rp.join('\n\n'),sorular:sorular,ogrenilen:ogr,ham:ham};}

/* ═══ 2) Personel şeridi (AjanSeridi) — TIKLANMAZ, yalnız durum ═══ */

  var hata=a.sonKosu&&a.sonKosu.status==='failed';return {metin:'boşta',nokta:hata?'hata':null,sayac:null};}

  h+='</div>';return h;}

/* ═══ 3) TEK komut kutusu — Koordinatör (KomutKutusu) ═══ */

  h+='<div id="ekip-komutAlt">'+cizKomutAlt(L)+'</div></div>';return h;}
function cizVakaCip(){if(!EKIP.vakaId)return '';return '<span class="ek-vaka-cip" title="Aynı iş dosyası zincirinde devam">'+ic_('link')+'<span>vaka #'+esc(String(EKIP.vakaId).slice(0,8))+'</span><u onclick="ekipVakaBagKaldir()" title="Bağı kaldır — yeni zincir aç">×</u></span>';}
function cizKomutAlt(L){var d=L&&L.durum?L.durum:null;var canli=!EKIP.dryRun;var kosuyor=!!(EKIP.kosu&&!EKIP.kosu.bitti);var maxYok=!!(d&&d.maxBagli===false);

/* ═══ 4) Canlı akış — süzgeç hapları + vaka kartları (IsAkisi + VakaSatiri) ═══ */
function cizAkis(L){var s=sayaclar(L);var vs=vakalar(L).slice().sort(vakaSirasi);var f=EKIP.suzgec;var mk=seciliMukellef();

    if(k.hata)h+='<div style="font-size:11px;color:'+R.kirmizi+'">'+esc(k.hata)+'</div>';
    if(!k.bitti&&k.isId)h+='<div><button class="ek-btn durdur" data-id="'+attr(k.isId)+'" onclick="ekipDurdur(this)">'+ic_('stop')+' Durdur</button></div>';
    h+='</div>';}
  if(!L){h+='<div class="ek-bos"><span class="ek-bos-ic">'+ic_('activity')+'</span><span>'+(telefonda()?'Akış yükleniyor…':'Akış verisi yok — canlı veri telefonda yüklenir')+'</span></div>';}
  else if(!L.akis){h+='<div class="ek-bos"><span class="ek-bos-ic">'+ic_('activity')+'</span><span>Akış alınamadı'+(L.hata?': '+esc(L.hata):'')+'</span></div>';}
  else if(!suz.length&&!(k&&!eslesti)){h+='<div class="ek-bos"><span class="ek-bos-ic">'+ic_('activity')+'</span><span>'+(f==='tumu'?'Bu pencerede iş yok — Koordinatör’e yukarıdan görev verin.':'Bu kutuda iş yok.')+'</span></div>';}
  else{suz.forEach(function(v){h+=cizVaka(v,k);});}
  h+='</div></div></div>';return h;}
function cizVaka(v,k){var rz=rozet(v);var acik=EKIP.acik===v.vakaId;var siz=v.kimde&&v.kimde.ajanId==='siz';var adimlar=v.adimlar||[];
  var yerel=k&&!k.bitti&&kosuVakayaAitMi(k,v);var kosuyor=yerel||adimlar.some(function(a){return a.tip==='is'&&a.durum==='running';});var nabiz=rz.nabiz&&kosuyor;
  var h='<div class="ek-vaka'+(acik?' acik':'')+'" style="border-color:'+(acik?rz.renk+'55':(v.gecikti?R.kirmizi+'66':'#e3e8ef'))+'"><div class="ek-bas" data-id="'+attr(v.vakaId)+'" onclick="ekipVakaAc(this)">';
  h+='<div class="ek-sol"><div class="ek-satir1"><b title="'+attr(v.mukellef?v.mukellef.ad:'Ofis geneli')+'">'+esc(v.mukellef&&v.mukellef.ad?v.mukellef.ad:'—')+'</b><span style="color:'+R.sonuk+';flex:0 0 auto">·</span><span title="'+attr(v.konu)+'">'+esc(v.konu||'Konu yok')+'</span></div>';
  h+='<div class="ek-satir2"><span style="display:inline-flex;align-items:center;gap:4px">kimde: '+mini(v.kimde?v.kimde.ajanId:'koordinator',siz?'Muzaffer Bey':(v.kimde?v.kimde.ad:''))+'<span style="color:'+(siz?R.altin:R.metin)+'">'+(siz?'Siz':esc(kisaAd(v.kimde?v.kimde.ajanId:'',v.kimde?v.kimde.ad:'')))+'</span></span><span>'+esc(goreliSaat(v.guncellendi))+'</span>'+(adimlar.length>1?'<span>'+adimlar.length+' adım</span>':'')+'</div></div>';
  h+='<div class="ek-sag">'+(v.gecikti?'<span class="ek-rozet" style="border:1px solid '+R.kirmizi+';color:'+R.kirmizi+'">gecikti</span>':'')+'<span class="ek-rozet" style="background:'+rz.renk+'1a;border:1px solid '+rz.renk+'55;color:'+rz.renk+'">'+(nabiz?'<span class="ek-nokta nabiz" style="background:'+rz.renk+';box-shadow:0 0 6px '+rz.renk+'"></span>':'')+rz.ad+'</span><span class="ek-kc '+(v.kuru?'kuru':'canli')+'">'+(v.kuru?'KURU':'CANLI')+'</span></div>';
  h+='<span style="color:'+R.sonuk+';display:inline-flex;transform:rotate('+(acik?'0':'-90')+'deg);transition:.15s;flex:0 0 auto;width:13px;height:13px">'+ic_('chev')+'</span></div>';

    // (c) açık kalemler — satır içi Onayla/Reddet · Yapıldı (her zaman görünür)

    if(kosan||(yerel&&k.isId))h+='<button class="ek-btn durdur" data-id="'+attr(kosan?kosan.isId:k.isId)+'" onclick="ekipDurdur(this)">'+ic_('stop')+' Durdur</button>';

    h+='</div>';}
  h+='</div>';return h;}
function cizKalem(kl,v){var onayMi=kl.tip==='onay';var renk=onayMi?R.altin:R.turuncu;

  h+='</div>';return h;}
function durumIkonu(d){if(d==='running')return '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="'+EKIP_ACCENT+'" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.2-8.5" stroke-linecap="round"/></svg>';
  if(d==='done')return '<span style="color:'+R.yesil+';display:inline-flex">'+ic_('check')+'</span>';if(d==='failed')return '<span style="color:'+R.kirmizi+';display:inline-flex">'+ic_('x')+'</span>';return '<span style="color:'+R.gri+';display:inline-flex">'+ic_('clock')+'</span>';}
function cizAdim(a){var saat=esc(saatKisa(a.baslangic));
  if(a.tip==='is'){var renk=ajanRengi(a.ajanId);var sure='';if(a.baslangic&&a.bitis){var d=ms(a.bitis)-ms(a.baslangic);if(d>=0)sure=sureKisa(d);}
    return '<div class="ek-adim" style="border-left:2px solid '+renk+'"><span class="ek-saat">'+saat+'</span>'+mini(a.ajanId,a.ajanId)+'<div class="ek-adim-ic"><div class="ek-l1"><b>'+esc(kisaAd(a.ajanId))+'</b><span class="ek-baslik'+(a.durum==='running'?' kosuyor':'')+'" title="'+attr(a.baslik)+'">'+esc(a.baslik)+'</span>'+durumIkonu(a.durum)+(sure?'<span style="color:'+R.sonuk+';font-size:10.5px">'+esc(sure)+'</span>':'')+(a.devir!=null?'<span class="ek-devir">→ devir #'+esc(a.devir)+'</span>':'')+'<span class="ek-kc '+(a.kuru?'kuru':'canli')+'">'+(a.kuru?'KURU':'CANLI')+'</span></div>'+(a.durum==='failed'&&a.hata?'<span class="ek-hata" title="'+attr(a.hata)+'">'+esc(a.hata)+'</span>':'')+'</div></div>';}
  if(a.tip==='onay'){var rk=a.durum==='EXECUTED'?R.yesil:(a.durum==='PENDING'?R.turuncu:R.gri);
    return '<div class="ek-adim" style="border-left:2px solid '+R.altin+'"><span class="ek-saat">'+saat+'</span><span style="color:'+R.altin+';display:inline-flex;width:14px;height:14px;flex:0 0 auto;margin-top:1px">'+ic_('sh')+'</span><div class="ek-adim-ic"><div class="ek-l1"><span class="ek-baslik" title="'+attr(a.confirmationText||a.baslik)+'">Onay kaydı <span style="font-size:10.5px;font-variant-numeric:tabular-nums">'+esc(String(a.id).slice(0,12))+'</span> · <span style="color:'+rk+'">'+esc(a.durum)+'</span>'+(a.baslik?' · '+esc(a.baslik):'')+(a.hedef?' → '+esc(a.hedef):'')+'</span></div></div></div>';}
  var rn=a.tur==='istek'?R.turuncu:(a.tur==='onay'?R.altin:R.ikincil);
  return '<div class="ek-adim" style="border-left:2px solid '+AJAN_RENK.koordinator+'"><span class="ek-saat">'+saat+'</span><span style="color:'+rn+';display:inline-flex;width:14px;height:14px;flex:0 0 auto;margin-top:1px">'+ic_('doc')+'</span><div class="ek-adim-ic"><div class="ek-l1"><span class="ek-baslik" style="white-space:normal"><b>Koordinatör notu:</b> '+esc(a.baslik)+(a.durum==='kapandi'?'<span style="color:'+R.yesil+'"> · kapandı</span>':'')+'</span></div>'+(a.govde?'<span class="ek-not">'+esc(a.govde)+'</span>':'')+'</div></div>';}

/* ═══ Tam çizim (buildModule) ve parçalı yenileme ═══ */
var PARCA={baslik:cizBaslik,serit:cizSerit,komut:cizKomut,akis:cizAkis};
function tamCiz(m){var L=veri();EKIP.dryRun=true;EKIP.canliTeyit=false;EKIP.onayTeyit=null; // her açılışta KURU (depoya yazılmaz)
  // Veri yoksa (ör. üstten mükellef değişti, modül go() ile açılmadı) RN yükleyicisini iste — go() zaten istediyse (1,5 sn içinde) tekrar isteme
  if(telefonda()&&!L){setTimeout(function(){if(!veri()&&Date.now()-EKIP.sonIstek>1500&&typeof morenNotifyModule==='function')morenNotifyModule('ekip');},600);}
  return (typeof dh==='function'?dh(m):'')+'<div id="ekip-baslik">'+cizBaslik(L)+'</div><div id="ekip-serit">'+cizSerit(L)+'</div><div id="ekip-komut">'+cizKomut(L)+'</div><div id="ekip-akis">'+cizAkis(L)+'</div>';}
function yenile(parcalar){var L=veri();(parcalar||['baslik','serit','komutAlt','akis']).forEach(function(p){var el=document.getElementById('ekip-'+p);if(!el)return;
    if(p==='komutAlt')el.innerHTML=cizKomutAlt(L);else if(p==='vaka-cip')el.innerHTML=cizVakaCip();else if(PARCA[p])el.innerHTML=PARCA[p](L);});
  try{if(typeof current!=='undefined'&&current==='detail'&&typeof detailId!=='undefined'&&detailId==='ekip'){var v=document.getElementById('v-detail');if(v)detailHTML=v.innerHTML;}}catch(e){}
  sayacBaslat();}
function acikMi(){try{return typeof current!=='undefined'&&current==='detail'&&typeof detailId!=='undefined'&&detailId==='ekip'&&!!document.getElementById('ekip-akis');}catch(e){return false;}}
/* Koşu süre sayacı — yalnız [data-ekip-sayac] metinlerini günceller (DOM yeniden çizilmez) */
function sayacBaslat(){var var_=document.querySelectorAll('[data-ekip-sayac]');if(!var_.length){if(EKIP.sayacT){clearInterval(EKIP.sayacT);EKIP.sayacT=null;}return;}
  if(EKIP.sayacT)return;EKIP.sayacT=setInterval(function(){var els=document.querySelectorAll('[data-ekip-sayac]');if(!els.length){clearInterval(EKIP.sayacT);EKIP.sayacT=null;return;}
    for(var i=0;i<els.length;i++){var b=Number(els[i].getAttribute('data-ekip-sayac'))||0;if(!b)continue;var t=els[i].textContent||'';var idx=t.indexOf(' · ');els[i].textContent=sayacMetni(Date.now()-b)+(idx>=0?t.slice(idx):'');}},1000);}

/* ═══ Etkileşimler (küresel — onclick'ten çağrılır) ═══ */
window.ekipToast=toast;
/* Yeniden yükleme isteği: telefonda RN yükleyicisini tetikler (morenNotifyModule); önizlemede canlı veri yok */
window.ekipYenileIste=function(){if(telefonda()&&typeof morenNotifyModule==='function'){morenNotifyModule('ekip');toast('Akış yenileniyor…');}else toast('Canlı veri yalnız telefonda yüklenir');};
(function(){var orj=window.morenNotifyModule;if(typeof orj!=='function')return;window.morenNotifyModule=function(mid){if(mid==='ekip')EKIP.sonIstek=Date.now();return orj.apply(this,arguments);};})();
window.ekipSuzgec=function(f){EKIP.suzgec=f;try{if(typeof haptic==='function')haptic('light');}catch(e){}yenile(['akis']);var el=document.getElementById('ekip-akis');if(el&&el.scrollIntoView)try{el.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}};
window.ekipVakaAc=function(el){var id=el.getAttribute('data-id');EKIP.acik=(EKIP.acik===id)?null:id;yenile(['akis']);};
window.ekipMetinDegisti=function(el){EKIP.gorev=el.value;if(EKIP.sablon){EKIP.sablon=null;var s=document.querySelectorAll('#ekip-komut .ek-sablon.on');for(var i=0;i<s.length;i++)s[i].classList.remove('on');}};
window.ekipSablon=function(el){var id=el.getAttribute('data-id');var s=null;for(var i=0;i<SABLONLAR.length;i++)if(SABLONLAR[i].id===id)s=SABLONLAR[i];if(!s)return;
  var mk=seciliMukellef();if(s.m&&!mk){toast('Bu görev mükellef ister — üstteki çubuktan mükellef seç');}
  EKIP.sablon=id;EKIP.vakaId=null;EKIP.gorev=s.g.replace(/\{mükellef\}/g,mk?(mk.ad||'seçili mükellef'):'seçili mükellef').replace(/\{dönem\}/g,s.d?donemEtiketi(seciliDonem()):'bu dönem');
  var ta=document.getElementById('ekipKomutMetin');if(ta){ta.value=EKIP.gorev;}var ss=document.querySelectorAll('#ekip-komut .ek-sablon');for(var j=0;j<ss.length;j++)ss[j].classList.toggle('on',ss[j].getAttribute('data-id')===id);yenile(['vaka-cip']);};
window.ekipKuru=function(){EKIP.dryRun=true;EKIP.canliTeyit=false;yenile(['komutAlt']);var k=document.getElementById('ekip-komut-kart');if(k)k.classList.remove('canli');};
window.ekipCanliIste=function(){if(!EKIP.dryRun)return;EKIP.canliTeyit=true;yenile(['komutAlt']);var z=EKIP.teyitZaman=Date.now();setTimeout(function(){if(EKIP.canliTeyit&&EKIP.teyitZaman===z){EKIP.canliTeyit=false;yenile(['komutAlt']);}},5000);};
window.ekipCanliEvet=function(){EKIP.dryRun=false;EKIP.canliTeyit=false;yenile(['komutAlt']);var k=document.getElementById('ekip-komut-kart');if(k)k.classList.add('canli');try{if(typeof haptic==='function')haptic('medium');}catch(e){}};
window.ekipCanliVazgec=function(){EKIP.canliTeyit=false;yenile(['komutAlt']);};
window.ekipVakaBagKaldir=function(){EKIP.vakaId=null;yenile(['vaka-cip']);};
window.ekipCevapla=function(el){var vid=el.getAttribute('data-id');EKIP.vakaId=vid||null;EKIP.sablon=null;if(!/^Cevap:/.test(EKIP.gorev||'')){EKIP.gorev='Cevap: ';}
  var ta=document.getElementById('ekipKomutMetin');if(ta){ta.value=EKIP.gorev;}yenile(['vaka-cip']);var k=document.getElementById('ekip-komut');if(k&&k.scrollIntoView)try{k.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}setTimeout(function(){var t=document.getElementById('ekipKomutMetin');if(t)t.focus();},350);};
/* Gönder → RN 'ekip-komut' (POST /ekip/koordinator/calistir, SSE beklenmez; RN akışı 5 sn'de bir tazeler) */
window.ekipGonder=function(btn){var g=(EKIP.gorev||'').trim();if(!g){toast('Önce Koordinatör’e görev yaz');var ta=document.getElementById('ekipKomutMetin');if(ta)ta.focus();return;}
  if(EKIP.kosu&&!EKIP.kosu.bitti){toast('Koşu sürüyor — bitince yeni görev verilebilir');return;}
  var L=veri();if(L&&L.durum&&L.durum.maxBagli===false){toast('Max bağlı değil — ajan koşamaz');return;}
  var mk=seciliMukellef();var params={gorev:g,dryRun:!!EKIP.dryRun};if(mk)params.taxpayerId=mk.id;if(EKIP.vakaId)params.vakaId=EKIP.vakaId;
  EKIP.kosu={gorev:g,basladi:Date.now(),bitti:false,dryRun:!!EKIP.dryRun,mukellefAd:mk?mk.ad:null,isId:null,vakaId:EKIP.vakaId||null};
  EKIP.vakaId=null;EKIP.gorev='';EKIP.sablon=null;var ta2=document.getElementById('ekipKomutMetin');if(ta2)ta2.value='';
  try{if(typeof haptic==='function')haptic('medium');}catch(e){}
  if(typeof morenAction==='function')morenAction(btn,'ekip-komut','Koordinatör başladı',params);
  yenile(['baslik','serit','komutAlt','akis','vaka-cip']);
  if(!telefonda()){setTimeout(function(){if(EKIP.kosu&&!EKIP.kosu.bitti){EKIP.kosu.bitti=true;EKIP.kosu.hata='Önizleme: canlı koşu yalnız telefonda';yenile(['baslik','serit','komutAlt','akis']);}},2500);}};
window.ekipOnayIste=function(btn){EKIP.onayTeyit=btn.getAttribute('data-id')||null;yenile(['akis']);};
window.ekipOnayVazgec=function(){EKIP.onayTeyit=null;yenile(['akis']);};
window.ekipOnayla=function(btn){var id=btn.getAttribute('data-id');if(!id)return;EKIP.onayTeyit=null;
  if(typeof morenAction==='function')morenAction(btn,'ekip-onayla','Gönderildi ✓',{id:id});};
window.ekipReddet=function(btn){var id=btn.getAttribute('data-id');if(!id)return;if(typeof morenAction==='function')morenAction(btn,'ekip-reddet','Reddedildi',{id:id,not:'Mobil uygulamadan reddedildi'});};
window.ekipIstekKapat=function(btn){var id=btn.getAttribute('data-id');if(!id)return;if(typeof morenAction==='function')morenAction(btn,'ekip-istek-kapat','Yapıldı ✓',{id:id});};
window.ekipDurdur=function(btn){var id=btn.getAttribute('data-id');if(!id)return;
  if(typeof morenAction==='function')morenAction(btn,'ekip-durdur','Durduruldu',{id:id});};
/* Rapor: alt panel (modal) açılır; RN GET /ekip/isler/:id → window.MOREN.applyEkipRapor(id, metin, meta) doldurur */
window.ekipRaporAc=function(el){var id=el.getAttribute('data-id');if(!id)return;var onb=EKIP.rapor[id];
  raporModal(id,onb?onb:null);
  if(onb&&onb.meta&&(onb.meta.status==='done'||onb.meta.status==='failed'))return; // bitmiş iş: önbellekten
  if(telefonda()){if(typeof morenAction==='function')morenAction(null,'ekip-rapor','Rapor açıldı',{id:id});}
  else{var b=document.getElementById('ekipRaporBox');if(b&&!onb)b.innerHTML='<div class="ek-bos"><span class="ek-bos-ic">'+ic_('doc')+'</span><span>Rapor metni telefonda yüklenir (önizlemede canlı veri yok)</span></div>';}};
function raporModal(id,r){if(typeof openModal!=='function')return;
  var h='<h3>İş raporu</h3><div class="ek-rapor-bas"><b>Rapor</b><span style="font-variant-numeric:tabular-nums">#'+esc(String(id).slice(0,8))+'</span><span id="ekipRaporMeta"></span></div><div id="ekipRaporBox" data-id="'+attr(id)+'">'+(r?raporGovde(id,r):'<div class="ek-bos"><span class="ek-bos-ic"><svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M21 12a9 9 0 1 1-6.2-8.5" stroke-linecap="round"/></svg></span><span>Rapor yükleniyor…</span></div>')+'</div>';
  h+='<div class="mbtns"><button class="cancel" onclick="closeModal()">Kapat</button></div>';
  openModal(h);if(r)raporMeta(r.meta);}
function raporMeta(meta){var el=document.getElementById('ekipRaporMeta');if(!el||!meta)return;var p=[];if(meta.ajanId)p.push(kisaAd(meta.ajanId));if(meta.model)p.push(meta.model);if(meta.durationMs!=null)p.push(sureKisa(meta.durationMs));if(meta.status)p.push(meta.status==='running'?'sürüyor':meta.status==='failed'?'hata':meta.status==='done'?'bitti':meta.status);if(meta.dryRun===false)p.push('CANLI');else if(meta.dryRun===true)p.push('KURU');el.textContent=p.length?('· '+p.join(' · ')):'';}
function raporGovde(id,r){var meta=r.meta||{};var metin=String(r.metin||'');var ay=cevapAyristir(metin);var h='';
  if(meta.hata)h+='<div class="ek-rapor-hata">⚠️ '+esc(meta.hata)+'</div>';
  if(ay.rapor||(!ay.sorular.length&&!ay.ogrenilen.length&&ay.ham))h+='<div class="ek-rapor-metin">'+esc(ay.rapor||ay.ham)+'</div>';
  if(!metin&&!meta.hata)h+='<div class="ek-bos"><span class="ek-bos-ic">'+ic_('doc')+'</span><span>Henüz rapor yok'+(meta.status==='running'?' — iş sürüyor':'')+'.</span></div>';
  if(ay.sorular.length){h+='<div class="ek-soru"><b>'+esc(kisaAd(meta.ajanId||'koordinator'))+' soruyor</b>'+ay.sorular.map(function(s){return '<p>'+esc(s)+'</p>';}).join('')+'<div class="ek-cevapsatir"><input id="ekipSoruCevap" placeholder="Cevabını yaz…"><button class="ek-btn istek" data-vaka="'+attr(meta.vakaId||id)+'" onclick="ekipSoruCevapla(this)">'+ic_('reply')+' Cevapla</button></div></div>';}
  if(ay.ogrenilen.length)h+='<div class="ek-ogrenilen"><span style="background:none;border:0;color:'+R.mor+';display:inline-flex;padding:0">'+ic_('cap')+'</span>'+ay.ogrenilen.map(function(o){return '<span>'+esc(o)+'</span>';}).join('')+'</div>';
  var liste=function(bas,ikon,renk,ogeler){if(!ogeler||!ogeler.length)return '';return '<div class="ek-liste" style="background:'+renk+'0d;border:1px solid '+renk+'2a"><div class="ek-lb" style="color:'+renk+'">'+ic_(ikon)+' '+bas+' <span style="opacity:.7">('+ogeler.length+')</span></div><ul>'+ogeler.map(function(o){return '<li>'+o+'</li>';}).join('')+'</ul></div>';};
  var argsKisa=function(a){if(a==null)return '';try{var s=typeof a==='string'?a:JSON.stringify(a);return s.length>120?s.slice(0,120)+'…':s;}catch(e){return '';}};
  h+=liste('Araçlar','wrench',ajanRengi(meta.ajanId||'koordinator'),(meta.toolUses||[]).map(function(t){return '<b>'+esc(aracAdi(t.name))+'</b> <i>'+esc(argsKisa(t.args))+'</i>';}));
  h+=liste('Kuru test — yapacaktı','flask','#2b8a3e',(meta.kuruTestYapilacaktilar||[]).map(function(t){return '<b>'+esc(aracAdi(t.name))+'</b> <i>'+esc(argsKisa(t.args))+'</i>';}));
  h+=liste('Onay bekleyen','sh',R.turuncu,(meta.onayBekleyen||[]).map(function(o){return esc(typeof o==='string'?o:(o&&o.previewId?('#'+o.previewId+' · '+aracAdi(o.name)):(o&&(o.aciklama||o.name))||argsKisa(o)));}));
  h+=liste('Öğrenilen','cap','#6741d9',(meta.ogrenilen||[]).map(function(o){return esc(o);}));
  return h;}
window.ekipSoruCevapla=function(btn){var inp=document.getElementById('ekipSoruCevap');var t=inp?inp.value.trim():'';if(!t){toast('Cevabını yaz');return;}
  EKIP.vakaId=btn.getAttribute('data-vaka')||null;EKIP.gorev='Cevap: '+t;EKIP.sablon=null;try{closeModal();}catch(e){}var ta=document.getElementById('ekipKomutMetin');if(ta)ta.value=EKIP.gorev;yenile(['vaka-cip']);
  var k=document.getElementById('ekip-komut');if(k&&k.scrollIntoView)try{k.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}};

/* ═══ RN → HTML köprü uçları ═══ */
window.MOREN=window.MOREN||{};
/* Rapor metni geldi: (id, metin, meta?) — meta {ajanId, model, durationMs, status, dryRun, hata, vakaId, toolUses, kuruTestYapilacaktilar, onayBekleyen, ogrenilen} */
window.MOREN.applyEkipRapor=function(id,metin,meta){try{var r={metin:metin==null?'':String(metin),meta:meta||{}};EKIP.rapor[id]=r;
  var box=document.getElementById('ekipRaporBox');if(box&&box.getAttribute('data-id')===String(id)){box.innerHTML=raporGovde(id,r);raporMeta(r.meta);}}catch(e){}};
/* Yerel koşu durumu: {isId?, vakaId?, gorev, basladi, bitti, hata?, dryRun} ya da null (temizle) */
window.MOREN.applyEkipKosu=function(k){try{if(!k){EKIP.kosu=null;}else{var e=EKIP.kosu||{};EKIP.kosu={gorev:k.gorev||e.gorev||'',basladi:k.basladi||e.basladi||Date.now(),bitti:!!k.bitti,hata:k.hata||null,dryRun:k.dryRun!=null?k.dryRun:e.dryRun,mukellefAd:k.mukellefAd||e.mukellefAd||null,isId:k.isId||e.isId||null,vakaId:k.vakaId||e.vakaId||null};}
  if(acikMi())yenile(['baslik','serit','komutAlt','akis']);}catch(e){}};
/* applyModule sarmalı: ekip modülü AÇIKKEN gelen veri (5 sn'lik tazeleme) komut kutusuna DOKUNMADAN parçalı çizilir (yazılan metin/odak kaybolmasın) */
(function(){var orj=window.MOREN.applyModule;window.MOREN.applyModule=function(mid,cid,data){
  if(mid==='ekip'){try{window.MOREN.moduleData=window.MOREN.moduleData||{};window.MOREN.moduleData[mid+'|'+cid]=data;}catch(e){}
    if(acikMi()&&typeof activeClient!=='undefined'&&String(activeClient)===String(cid)){yenile(['baslik','serit','komutAlt','akis']);return;}}
  if(typeof orj==='function')return orj.apply(this,arguments);};})();

/* ═══ Kayıt: modül + menü ═══ */
if(window.MOREN_EK){
  MOREN_EK.modulEkle('ekip',{t:'Moren Ekip',sub:'Koordinatöre komut · canlı akış',kind:'ekip'},function(m,id){return tamCiz(m);});
  MOREN_EK.navEkle('Moren AI',['robot','Ekip Konsolu',(typeof C!=='undefined'&&C.gold)||'var(--gold)','m:ekip']);
  try{if(typeof modPatch==='function')modPatch();}catch(e){}
}
})();
</script>
