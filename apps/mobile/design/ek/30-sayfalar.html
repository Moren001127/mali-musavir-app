<!-- EK PAKET: sayfalar (2026-09-13) — portala sonradan eklenen, mobilde olmayan sayfalar.
     İletim Raporu · Aylık Ödeme Listesi · Denetim Günlüğü (+ Ayarlar satırı) · Kişisel Bütçe (PIN'li özet).
     Kural: içerik UYDURMA yok — alanlar apps/api controller'larının döndürdüğü gerçek alanlar; veri yoksa "veri yok".
     Yalnız müşavir tarafı (persona 'adv'); mükellef tarafına hiçbir şey eklenmez.
     RN tarafı: lib/ek/sayfalar.ts (yükleyiciler + 'denetim-yukle' / 'butce-pin' / 'butce-kilitle' aksiyonları). -->
<style>
/* sayfalar paketi — küçük durum daireleri, PIN kutusu, sekme düğmeleri */
.sf-dot{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid transparent;flex:0 0 auto}
.sf-dot svg{width:12px;height:12px;stroke-width:2.6;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.sf-legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 4px 2px;font-size:10.5px;color:var(--muted)}
.sf-legend span{display:inline-flex;align-items:center;gap:5px}
.sf-legend .sf-dot{width:16px;height:16px}.sf-legend .sf-dot svg{width:9px;height:9px}
.sf-note{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;border-radius:15px;font-size:12px;line-height:1.5}
.sf-note svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
.sf-pin{width:100%;box-sizing:border-box;text-align:center;letter-spacing:10px;font-size:24px;font-variant-numeric:tabular-nums;background:#fff;border:1px solid #dde3ea;border-radius:12px;padding:13px 8px 13px 18px;color:var(--text);outline:none;margin-top:14px}
.sf-pin:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-line)}
.sf-pin::placeholder{color:var(--faint);letter-spacing:8px}
.sf-mini{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:center}
.sf-ad{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<script>
(function(){
'use strict';
if(!window.MOREN_EK||typeof MOREN_EK.modulEkle!=='function'){return;}

/* ================= ORTAK YARDIMCILAR (yalnız bu paket) ================= */
var AYL=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function telefonda(){return !!window.ReactNativeWebView;}
/* Seçili dönem 'YYYY-MM' (ana HTML'deki dönem seçiciyle aynı kaynak) */
function donemKey(){var p=donemParts();return p.y+'-'+String(p.m).padStart(2,'0');}
function donemAdi(v){var m=String(v||'').match(/(\d{4})[-/](\d{1,2})/);if(!m)return v||'—';var a=parseInt(m[2],10);return (a>=1&&a<=12)?(AYL[a-1]+' '+m[1]):String(v);}
/* 7046.77 → "7.046,77 ₺" (kuruşlu tutarlar; sayaçlarda tl() kullanılır) */
function para(n){if(n===null||n===undefined||n===''||isNaN(n))return '—';var v=Number(n);var neg=v<0;var s=Math.abs(v).toFixed(2).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'-':'')+s[0]+','+s[1]+' ₺';}
function ini(ad){var p=String(ad||'').trim().split(/\s+/).filter(Boolean);return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();}
/* Ofis geneli sayfalar: veri hangi mükellef anahtarıyla geldiyse onu kullan (mükellef değişince kaybolmasın) */
function veri(mid){var d=modLive(mid);if(d)return d;try{var md=window.MOREN.moduleData||{};for(var k in md){if(k.indexOf(mid+'|')===0&&md[k])return md[k];}}catch(e){}return null;}
function kart(msg){return '<div class="card"><div style="padding:26px 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55">'+msg+'</div></div>';}
function yukleniyor(){return kart('Yükleniyor…');}
/* Tarayıcı önizlemesinde RN köprüsü yok: boş hâli göster, uydurma veri gösterme */
function onizleme(bosMsg){return kart(bosMsg+'<br><span style="font-size:11px;opacity:.75">önizleme · canlı veri telefonda yüklenir</span>');}
function hataKart(msg){return '<div class="card" style="border-color:#ffc9c9"><div style="padding:22px 18px;text-align:center;color:var(--rose);font-size:13px;line-height:1.5">'+esc(msg)+'</div></div>';}
function sfSeg(items,aktif,fn){return '<div class="seg">'+items.map(function(it){return '<button class="'+(it.k===aktif?'on':'')+'" onclick="'+fn+'(\''+it.k+'\')">'+it.t+'</button>';}).join('')+'</div>';}
function bosSatir(msg){return '<div style="padding:22px;text-align:center;color:var(--muted);font-size:13px">'+msg+'</div>';}
/* Açık modülü yeniden çiz (setDonem ile aynı kalıp) */
function yenile(id){try{if(current==='detail'&&detailId===id){detailHTML=buildModule(id);var el=document.getElementById('v-detail');if(el)el.innerHTML=detailHTML;}}catch(e){}}
function donemChips(){return selchip('YIL',donemYilLabel(),'calCheck','openDonemPicker()')+selchip('AY',donemAyLabel(),'calCheck','openDonemPicker()');}
var DOT={check:'<path d="m5 12 5 5L20 7"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',minus:'<path d="M5 12h14"/>',ban:'<circle cx="12" cy="12" r="9"/><path d="m5.5 5.5 13 13"/>',flask:'<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/>'};
function dot(k,c,bg){return '<span class="sf-dot" style="color:'+c+';background:'+(bg||('color-mix(in srgb,'+c+' 14%,transparent)'))+';border-color:color-mix(in srgb,'+c+' 35%,transparent)"><svg viewBox="0 0 24 24">'+(DOT[k]||'')+'</svg></span>';}
function saat(ts){var d=new Date(ts);if(isNaN(d.getTime()))return '';return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function gunAy(ts){var d=new Date(ts);if(isNaN(d.getTime()))return '';return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');}

/* ======================================================================
   a) İLETİM RAPORU — GET /akilli-bildirim/report?month=YYYY-MM
      totals{total,sent,failed,bekleyen,badContact,testGonderim,mukellefSayisi}
      taxpayers[{taxpayerId,unvan,VERGI,SGK,ETEBLIGAT,ODEME_LISTESI}] · hücre {status,error,channel,testMode,kanallar[]}
      "Başarısızları Yeniden Dene" MOBİLDE YOK — yalnız okuma.
   ====================================================================== */
var IR_KAT=[{key:'VERGI',label:'Vergi'},{key:'SGK',label:'SGK'},{key:'ETEBLIGAT',label:'e-Tebligat'}];
var IR_D={iletildi:{i:'check',c:'#2f9e44'},hata:{i:'x',c:'#e03131'},kapali:{i:'ban',c:'#e8590c'},bekliyor:{i:'clock',c:'#e8590c'},test:{i:'flask',c:'#1971c2'},yok:{i:'minus',c:'#cbd5e1'}};
var KANAL={WHATSAPP:'WhatsApp',EMAIL:'E-posta'};
function irSebep(e){return String(e||'').replace(/^ILETISIM-/,'');}
function irDurum(v){if(!v)return 'yok';if(v.status==='BEKLIYOR')return /kapalı|kapsam dışı|pasif/i.test(String(v.error||''))?'kapali':'bekliyor';if(v.status==='SENT')return v.testMode?'test':'iletildi';if(v.status==='SKIPPED')return 'yok';return 'hata';}
function irIpucu(v){if(!v)return 'Bu ay bu kategoride belge yok';var L=(v.kanallar&&v.kanallar.length?v.kanallar:[v]).map(function(k){var kanal=KANAL[String(k.channel||'')]||k.channel||'kanal';var durum=k.status==='SENT'?(k.testMode?'test alıcısına gitti':'iletildi'):k.status==='FAILED'?('iletilemedi — '+irSebep(k.error)):k.status==='BEKLIYOR'?irSebep(k.error):k.status==='SKIPPED'?'atlandı':k.status;return v.status==='BEKLIYOR'?durum:(kanal+': '+durum);});return L.join(' · ');}
/* Satır özeti — web sayfasındaki satirOzeti ile aynı karar sırası */
function irOzet(r){var hat=IR_KAT.filter(function(k){return r[k.key]&&r[k.key].status==='FAILED';});var bek=IR_KAT.filter(function(k){return r[k.key]&&r[k.key].status==='BEKLIYOR';});var tst=IR_KAT.filter(function(k){return r[k.key]&&r[k.key].status==='SENT'&&r[k.key].testMode;});
  if(hat.length){var ilet=hat.some(function(k){return String(r[k.key].error||'').indexOf('ILETISIM-')===0;});return {d:'hata',kisa:ilet?'İletişim eksik':(hat.length>1?hat.length+' iletilemedi':'İletilemedi'),tam:hat.map(function(k){return k.label+': '+irSebep(r[k.key].error);}).join(' · ')};}
  if(bek.length){var s=irSebep(r[bek[0].key].error);var kap=/kapalı|kapsam dışı|pasif/i.test(s);return {d:kap?'kapali':'bekliyor',kisa:kap?'Kapalı':'Bekliyor',tam:bek.map(function(k){return k.label+': '+irSebep(r[k.key].error);}).join(' · ')};}
  if(tst.length)return {d:'test',kisa:'Test',tam:'Test alıcısına gitti, mükellef almadı'};
  return {d:'iletildi',kisa:'Tamam',tam:'Tüm belgeler mükellefe iletildi'};}
function irSorunlu(r){return IR_KAT.some(function(k){return r[k.key]&&r[k.key].status!=='SENT';})||IR_KAT.some(function(k){return r[k.key]&&r[k.key].status==='SENT'&&r[k.key].testMode;});}
window.__sfIrSorunlu=false;window.__sfIrRows=[];
window.sfIrFiltre=function(k){window.__sfIrSorunlu=(k==='eksik');yenile('iletim-raporu');};
window.sfIrDetay=function(i){var r=(window.__sfIrRows||[])[i];if(!r)return;var oz=irOzet(r);var html='<h3>'+esc(r.unvan)+'</h3><div style="font-size:12px;color:var(--muted);margin-top:2px">'+esc(oz.tam)+'</div><div class="card" style="margin-top:14px;padding:4px 16px">'+IR_KAT.map(function(k){var v=r[k.key];var d=irDurum(v);var D=IR_D[d];return '<div class="row" style="cursor:default">'+dot(D.i,D.c)+'<div class="m"><b>'+k.label+'</b><span style="white-space:normal">'+esc(irIpucu(v))+'</span></div></div>';}).join('')+'</div><div class="mbtns"><button class="cancel" onclick="closeModal()">Kapat</button></div>';openModal(html);};
function vIletim(m){var L=veri('iletim-raporu');var dk=donemKey();var head=dh(Object.assign({},m,{sub:donemAdi(dk)}))+'<div class="selrow">'+donemChips()+'</div>';
  if(!telefonda())return head+onizleme('Bu ay ne gönderim kaydı ne de gönderilecek belge var');
  if(!L||L.month!==dk)return head+yukleniyor();
  if(L.hata)return head+hataKart('Rapor alınamadı · '+L.hata);
  var T=L.totals||{};var tum=L.taxpayers||[];window.__sfIrRows=tum;var sorunluN=tum.filter(irSorunlu).length;var rws=window.__sfIrSorunlu?tum.filter(irSorunlu):tum;
  var h=head+ctrs([{i:'send',c:C.gold,n:T.total||0,t:'Gönderim kaydı',s:(T.mukellefSayisi!=null?T.mukellefSayisi:tum.length)+' mükellef'},{i:'check',c:C.green,n:T.sent||0,t:'İletildi',s:T.testGonderim?(T.testGonderim+' test gönderimi hariç'):''},{i:'shield',c:C.rose,n:T.failed||0,t:'İletilmedi',s:T.badContact?(T.badContact+' tanesi iletişim bilgisi eksik'):''},{i:'clock',c:C.amber,n:T.bekleyen||0,t:'Hiç gönderilmedi',s:'belge var, gönderim yok'}]);
  if(T.testGonderim>0)h+='<div class="sf-note" style="color:#1971c2;background:#e7f5ff;border:1px solid #c5e3fb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+DOT.flask+'</svg><span><b>'+T.testGonderim+' gönderim test modunda</b> yapıldı — belgeler mükellefe değil test alıcısına gitti; "iletildi" sayılmaz. Test modu Ayarlar &gt; Akıllı Bildirim\'den (portal) kapatılır.</span></div>';
  /* Baskın sebep: aynı sebep 5+ satırda tekrar ediyorsa tek bandda yaz */
  var say={};tum.forEach(function(r){IR_KAT.forEach(function(k){var c=r[k.key];if(c&&c.status==='BEKLIYOR'){var s=irSebep(c.error);say[s]=(say[s]||0)+1;}});});var en=null;for(var s in say){if(!en||say[s]>en[1])en=[s,say[s]];}
  if(en&&en[1]>=5)h+='<div class="sf-note" style="color:#d9480f;background:#fff4e6;border:1px solid #ffd8a8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+DOT.info+'</svg><span><b>'+en[1]+' gönderim</b> aynı sebeple bekliyor: <b>'+esc(en[0])+'</b>. Bu satırlar <b>Kapalı</b> olarak işaretli.</span></div>';
  h+=sfSeg([{k:'tum',t:'Tümü ('+tum.length+')'},{k:'eksik',t:'Yalnız eksikler ('+sorunluN+')'}],window.__sfIrSorunlu?'eksik':'tum','sfIrFiltre');
  var COLS=[C.sky,C.gold,C.amber,C.green,C.rose,C.copper,C.violet,C.steel];
  h+='<div class="card" style="padding:6px 16px">'+(rws.length?rws.map(function(r){var idx=tum.indexOf(r);var oz=irOzet(r);var D=IR_D[oz.d];var cells=IR_KAT.map(function(k){var d=irDurum(r[k.key]);var X=IR_D[d];return dot(X.i,X.c);}).join('');return '<div class="row" onclick="sfIrDetay('+idx+')"><div class="avatar" style="width:38px;height:38px;font-size:13px;background:linear-gradient(160deg,'+COLS[idx%COLS.length]+',#0000)">'+ini(r.unvan)+'</div><div class="m"><b class="sf-ad">'+esc(r.unvan)+'</b><span>'+esc(oz.tam)+'</span></div><div class="r"><div style="display:flex;gap:4px">'+cells+'</div><span class="badge" style="color:'+D.c+';background:color-mix(in srgb,'+D.c+' 14%,transparent)">'+oz.kisa+'</span></div></div>';}).join(''):bosSatir(window.__sfIrSorunlu?'Eksik gönderim yok — bu ayki belgelerin tamamı iletilmiş':'Bu ay ne gönderim kaydı ne de gönderilecek belge var'))+'</div>';
  h+='<div class="sf-legend">'+[['iletildi','iletildi'],['test','test alıcısı'],['hata','iletilemedi'],['kapali','kapalı / kapsam dışı'],['bekliyor','hiç gönderilmedi'],['yok','belge yok']].map(function(x){return '<span>'+dot(IR_D[x[0]].i,IR_D[x[0]].c)+x[1]+'</span>';}).join('')+'</div>';
  h+='<div class="sf-mini">Daireler sırasıyla Vergi · SGK · e-Tebligat. Yeniden gönderim yalnız portaldan yapılır.</div>';
  return h;}
MOREN_EK.modulEkle('iletim-raporu',{t:'İletim Raporu',sub:'Kim aldı, kim almadı',kind:'sayfa'},vIletim);
MOREN_EK.navEkle('Ofis',['send','İletim Raporu',C.green,'m:iletim-raporu']);

/* ======================================================================
   b) AYLIK ÖDEME LİSTESİ — GET /aylik-odeme?month · GET /aylik-odeme/eksikler?month
      liste[{taxpayerId,unvan,phone,email,satirlar[{tur,kaynak,donem,sonGun,tutar}],toplam}]
      eksik[{taxpayerId,unvan,kaynak,sebep,beyanTipi,donem,listedeVar}]
      "Tümüne Gönder / WhatsApp ile Gönder" MOBİLDE YOK — yalnız okuma.
   ====================================================================== */
var BEYAN_ETIKET={KURUMLAR:'Kurumlar',GELIR:'Gelir',KDV1:'KDV1',KDV2:'KDV2',KDV4:'KDV4',KDV9015:'KDV9015',DAMGA:'Damga',MUHSGK:'MUHSGK',MUHSGK2:'MUHSGK2',GGECICI:'Gelir Geçici',KGECICI:'Kurum Geçici',POSET:'Poşet',BILDIRGE:'Bildirge',EDEFTER:'E-Defter',OTV1:'ÖTV1',OTV3A:'ÖTV3A',OTV3B:'ÖTV3B',OTV4:'ÖTV4',KONAKLAMA:'Konaklama',OIV:'ÖİV',GMSI:'GMSİ',TURIZM:'Turizm Payı'};
function odemeAdi(s){var ham=String(s.tur||'').trim();if(s.kaynak==='SGK')return /tahakkuk/i.test(ham)?'SGK Prim Tahakkuku':('SGK '+ham).trim();return BEYAN_ETIKET[ham]||ham||'—';}
function tarihAdi(t){if(!t)return '—';var m=String(t).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(!m)return t;return m[1].padStart(2,'0')+'.'+m[2].padStart(2,'0')+'.'+m[3];}
function vade(t){var m=t&&String(t).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(!m)return null;var son=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));var b=new Date();b.setHours(0,0,0,0);var g=Math.round((son.getTime()-b.getTime())/86400000);if(g<0)return {c:'#c92a2a',t:'geçti'};if(g===0)return {c:'#c92a2a',t:'bugün'};if(g<=3)return {c:'#d9480f',t:g+' gün'};return null;}
function eksikMetni(e){var ad=e.beyanTipi?(BEYAN_ETIKET[e.beyanTipi]||e.beyanTipi):null;var d=e.donem?donemAdi(e.donem):null;if(ad&&d)return ad+' ('+d+') — '+e.sebep;if(ad)return ad+' — '+e.sebep;if(d)return d+' — '+e.sebep;return e.sebep||'';}
window.__sfAoSekme='liste';window.__sfAoRows=[];
window.sfAoSekme=function(k){window.__sfAoSekme=k;yenile('aylik-odeme');};
window.sfAoCetvel=function(i){var r=(window.__sfAoRows||[])[i];if(!r)return;var html='<h3>'+esc(r.unvan)+'</h3><div style="font-size:12px;color:var(--muted);margin-top:2px">Bu ay ödenecek vergi tahakkukları ve SGK primleri</div><div class="card" style="margin-top:14px"><div class="stmt">'+(r.satirlar||[]).map(function(s){var v=vade(s.sonGun);var sgk=s.kaynak==='SGK';return '<div class="sline"><div><b><span style="display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:middle;background:'+(sgk?'#1971c2':'var(--primary)')+'"></span>'+esc(odemeAdi(s))+'</b><small>'+esc(donemAdi(s.donem))+' · son ödeme '+tarihAdi(s.sonGun)+(v?' <span style="color:'+v.c+';font-weight:700">'+v.t+'</span>':'')+'</small></div><div class="amt">'+para(s.tutar)+'</div></div>';}).join('')+'<div class="sline fin"><div><b>TOPLAM</b></div><div class="amt" style="color:var(--primary-ink);font-weight:700">'+para(r.toplam)+'</div></div></div></div><div class="sf-mini">WhatsApp/e-posta gönderimi yalnız portaldan yapılır.</div><div class="mbtns"><button class="cancel" onclick="closeModal()">Kapat</button></div>';openModal(html);};
function vAylikOdeme(m){var L=veri('aylik-odeme');var dk=donemKey();var head=dh(Object.assign({},m,{sub:donemAdi(dk)}))+'<div class="selrow">'+donemChips()+'</div>';
  if(!telefonda())return head+onizleme(donemAdi(dk)+' dönemi için tahakkuk verisi bulunamadı');
  if(!L||L.month!==dk)return head+yukleniyor();
  if(L.hata)return head+hataKart('Liste alınamadı · '+L.hata);
  var rws=L.list||[];window.__sfAoRows=rws;var eks=L.eksik||[];var disi=eks.filter(function(e){return !e.listedeVar;});var ekli=eks.filter(function(e){return e.listedeVar;});
  var uniq=function(a){var s={};a.forEach(function(e){s[e.taxpayerId]=1;});return Object.keys(s).length;};
  var genel=rws.reduce(function(t,r){return t+(Number(r.toplam)||0);},0);
  var h=head+ctrs([{i:'users',c:C.gold,n:rws.length,t:'Listede mükellef',s:(L.bilgi&&L.bilgi.takipUyeSayisi!=null)?(L.bilgi.takipUyeSayisi+' takipte'):''},{i:'wallet',c:C.green,n:tl(genel),t:'Genel toplam',s:'vergi + SGK'},{i:'bell',c:C.amber,n:uniq(disi),t:'Listede yok',s:'belge / beyanname eksik'},{i:'shield',c:C.rose,n:uniq(ekli),t:'Listede var, eksiği var'}]);
  h+=sfSeg([{k:'liste',t:'Ödeme Listesi'},{k:'eksik',t:'Listede Yok ('+eks.length+')'}],window.__sfAoSekme,'sfAoSekme');
  var COLS=[C.gold,C.sky,C.green,C.amber,C.rose,C.copper,C.violet,C.steel];
  if(window.__sfAoSekme==='eksik'){
    var grup=function(baslik,arr){if(!arr.length)return '';return '<div class="sec"><h3 style="font-size:16px">'+baslik+'</h3><span class="badge b-amber">'+arr.length+' kalem</span></div><div class="card" style="padding:6px 16px">'+arr.map(function(e){var sgk=e.kaynak==='SGK';return '<div class="row" style="cursor:default">'+iconBox(sgk?'brief':'layers',sgk?C.sky:C.gold)+'<div class="m"><b>'+esc(e.unvan)+'</b><span style="white-space:normal">'+esc(eksikMetni(e))+'</span></div><span class="badge '+(sgk?'b-sky':'b-amber')+'">'+(sgk?'SGK':'Vergi')+'</span></div>';}).join('')+'</div>';};

function vDenetim(m){var L=veri('denetim-gunlugu');var head=dh(Object.assign({},m,{sub:(L&&L.total!=null)?(L.total+' kayıt'):(m.sub||'')}));

window.sfBtAc=function(btn){var inp=document.getElementById('sfBtPin');var v=(inp&&inp.value?inp.value:'').replace(/\D/g,'');if(!/^\d{6}$/.test(v)){if(typeof modToast==='function')modToast('PIN 6 haneli olmalı');if(inp)inp.focus();return;}if(inp)inp.value='';if(typeof morenAction==='function')morenAction(btn,'butce-pin','Açıldı',{pin:v});};

function btPinEkrani(p){p=p||{};var h='<div class="card" style="padding:22px 18px;text-align:center"><div style="width:52px;height:52px;border-radius:16px;margin:0 auto 10px;display:grid;place-items:center;color:var(--primary-ink);background:var(--primary-soft);border:1px solid var(--primary-line);position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px">'+DOT.lock+'</svg></div><div style="font-size:17px;font-weight:700;color:var(--ink);position:relative">Kişisel Bütçe kilidi</div>';

  if(p.kilitli)return h+'<div style="font-size:12.5px;margin-top:6px;color:#c92a2a;line-height:1.5">Çok fazla yanlış deneme yapıldı. Bir süre sonra tekrar deneyin.'+(p.kilitBitis?' ('+esc(saat(p.kilitBitis))+' sonrası)':'')+'</div></div>';
  return h+'<div style="font-size:12.5px;color:var(--muted);margin-top:6px">Devam etmek için 6 haneli şifrenizi girin.</div><input id="sfBtPin" class="sf-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="off"><div class="lucabtn" style="margin-top:12px;position:relative" onclick="sfBtAc(this)">'+ic('key')+' Kilidi Aç</div>'+(p.kalanDeneme!=null&&p.kalanDeneme<5?'<div class="sf-mini" style="color:#d9480f">'+p.kalanDeneme+' deneme hakkı kaldı</div>':'<div class="sf-mini">Şifre cihazda saklanmaz; her açılışta sorulur.</div>')+'</div>';}
function vButce(m){var L=veri('butce');var dk=donemKey();var head=dh(Object.assign({},m,{sub:'yalnız size özel · '+donemAdi(dk)}));

  var b=o.borcOzet||{};var hes=o.hesapOzet||[];var netC=(Number(o.net)||0)>=0?'#fff':'#ffd8d8';
  var h=head+'<div class="selrow">'+donemChips()+'<div class="selchip" onclick="sfBtKilitle()" style="cursor:pointer"><small>MODÜL</small><b style="color:var(--rose)">'+ic('shield')+'Kilitle</b></div></div>';
  h+='<div class="hero" style="padding:18px"><div class="lab">BU AY NET</div><div class="big" style="color:'+netC+'">'+para(o.net)+'</div><div class="sub">Gelir − gider · '+esc(donemAdi(o.donem||dk))+(Number(o.gelir)>0?' · gelirin %'+Math.round((Number(o.net)||0)/Number(o.gelir)*100)+'’i':'')+'</div></div>';
  h+=ctrs([{i:'trend',c:C.green,n:tl(o.gelir),t:'Gelir'},{i:'wallet',c:C.rose,n:tl(o.gider),t:'Gider',s:'Ofis '+tl(o.meslekiGider)+' · Kişisel '+tl(o.kisiselGider)},{i:'bank',c:C.violet,n:tl(o.nakitVarlik),t:'Net varlıklar',s:(Number(o.nakitKasasi)||0)!==0?('Bankada '+tl(o.bankaBakiyesi)+' · elde '+tl(o.nakitKasasi)):(hes.length?hes.length+' banka hesabı':'Banka hesabı tanımlı değil')},{i:'file',c:C.amber,n:tl(b.toplam),t:'Toplam borç',s:'Kart '+tl((Number(b.kart)||0)+(Number(b.kartDonemIci)||0))+' · Kredi '+tl(b.kredi)+((Number(b.kmh)||0)>0?' · Ek hesap '+tl(b.kmh):'')},{i:'scale',c:(Number(o.netVarlik)||0)>=0?C.green:C.rose,n:tl(o.netVarlik),t:'Varlık − borç',s:'hesaptaki para − tüm borçlar'},{i:'check',c:C.gold,n:tl(o.odemeKapasitesi),t:'Ödeme kapasitesi',s:'borca ayrılabilecek'}]);

  var uy=o.uyarilar||[];if(uy.length)h+='<div class="sec"><h3>Uyarılar</h3><span class="badge b-amber">'+uy.length+'</span></div>'+dkRows(uy.map(function(u){return {lvl:u.seviye==='KRITIK'?'e':(u.seviye==='UYARI'?'w':'i'),t:esc(u.baslik),s:esc(u.mesaj)};}));
  h+='<div class="sf-mini">Yalnız özet. Hareket girişi, kartlar ve ödeme planı portalda.</div>';
  return h;}
