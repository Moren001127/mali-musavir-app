<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Moren — Duyuru Şablonu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Caveat:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1238;
    --navy-2: #1a2470;
    --navy-soft: #2a3490;
    --white: #ffffff;
    --paper: #f7f6f3;
    --paper-2: #efece5;
    --line: #e0ddd4;
    --line-2: #d4d0c4;
    --ink: #0d1238;
    --muted: #6b6b6b;
    --muted-2: #8a8a8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #e9e6df;
    font-family: 'Manrope', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 48px 24px 120px;
  }

  .page-header { max-width: 1200px; margin: 0 auto 40px; text-align: center; }
  .page-header h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400; font-size: 44px;
    color: var(--navy); margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  .page-header p {
    font-size: 13px; color: var(--muted); margin: 0;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.02em;
  }

  .grid {
    max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 56px; justify-items: center;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }

  .variant-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .variant-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 500;
  }

  .card {
    width: 540px; height: 540px;
    position: relative; overflow: hidden;
    box-shadow: 0 30px 60px -25px rgba(13, 18, 56, 0.20), 0 4px 12px rgba(0,0,0,0.04);
  }
  .card-inner {
    width: 1080px !important;
    height: 1080px !important;
    min-height: 1080px;
    transform: scale(0.5); transform-origin: top left;
    position: absolute; top: 0; left: 0;
    overflow: hidden;
  }
  .v4.card-inner {
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 1080px;
  }

  /* ============================================================
     V1 — DEEP NAVY MINIMAL
     Tek lacivert blok, dev serif tipografi, ince beyaz çizgiler
     ============================================================ */
  .v1 {
    background: var(--navy);
    color: white;
    padding: 80px;
    display: flex; flex-direction: column;
  }
  .v1 .v1-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding-bottom: 32px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .v1 .v1-brand {
    display: flex; align-items: center; gap: 16px;
  }
  .v1 .v1-mark {
    width: 56px; height: 56px;
    border: 1.5px solid white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-size: 32px;
    line-height: 1; padding-bottom: 4px;
    color: white;
  }
  .v1 .v1-brand-text {
    font-family: 'Instrument Serif', serif;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .v1 .v1-brand-text small {
    display: block;
    font-family: 'Manrope', sans-serif;
    font-size: 11px; letter-spacing: 0.32em;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    margin-top: 6px;
    font-weight: 600;
  }
  .v1 .v1-meta {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.02em;
    line-height: 1.6;
    white-space: nowrap;
  }
  .v1 .v1-meta strong {
    display: block;
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    color: white;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  .v1 .v1-mid {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    padding: 60px 0;
  }
  .v1 .v1-eyebrow {
    font-size: 13px; letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    font-weight: 500;
    margin-bottom: 36px;
    display: flex; align-items: center; gap: 16px;
  }
  .v1 .v1-eyebrow::before {
    content: ''; width: 32px; height: 1px; background: rgba(255,255,255,0.4);
  }
  .v1 .v1-title {
    font-family: 'Instrument Serif', serif;
    font-size: 88px; line-height: 1.0;
    font-weight: 400;
    color: white;
    margin: 0 0 36px;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .v1 .v1-body {
    font-size: 22px; line-height: 1.55;
    color: rgba(255,255,255,0.78);
    font-weight: 400;
    text-wrap: pretty;
    max-width: 820px;
  }

  .v1 .v1-foot {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 48px;
    padding-top: 32px;
    border-top: 1px solid rgba(255,255,255,0.15);
  }
  .v1 .v1-foot .lbl {
    font-size: 10px; letter-spacing: 0.32em;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .v1 .v1-foot .val {
    font-size: 17px;
    color: white;
    font-weight: 500;
    line-height: 1.4;
  }

  /* ============================================================
     V2 — PAPER WHITE EDITORIAL
     Beyaz/krem zemin, navy tipografi, ferah magazin ruhu
     ============================================================ */
  .v2 {
    background: var(--paper);
    color: var(--navy);
    padding: 90px 80px;
    display: flex; flex-direction: column;
  }
  .v2 .v2-top {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .v2 .v2-brand-line {
    font-family: 'Instrument Serif', serif;
    font-size: 38px;
    color: var(--navy);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .v2 .v2-brand-line small {
    display: block;
    font-family: 'Manrope', sans-serif;
    font-size: 12px; letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 8px;
    font-weight: 600;
  }
  .v2 .v2-rule {
    width: 60px; height: 1.5px;
    background: var(--navy);
    margin-top: 14px;
  }
  .v2 .v2-meta {
    font-family: 'JetBrains Mono', monospace;
    text-align: right;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    white-space: nowrap;
  }
  .v2 .v2-meta strong {
    display: block;
    font-family: 'Instrument Serif', serif;
    font-size: 24px;
    color: var(--navy);
    font-weight: 400;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }

  .v2 .v2-mid {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    padding: 60px 0;
  }
  .v2 .v2-eyebrow {
    font-size: 13px; letter-spacing: 0.4em;
    color: var(--navy);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 32px;
  }
  .v2 .v2-title {
    font-family: 'Instrument Serif', serif;
    font-size: 92px; line-height: 1.0;
    font-weight: 400;
    color: var(--navy);
    margin: 0 0 36px;
    letter-spacing: -0.04em;
    text-wrap: balance;
  }
  .v2 .v2-title em {
    font-style: italic;
  }
  .v2 .v2-body {
    font-size: 22px; line-height: 1.55;
    color: #2a2a2a;
    font-weight: 400;
    text-wrap: pretty;
    max-width: 820px;
  }

  .v2 .v2-foot {
    border-top: 1px solid var(--line-2);
    padding-top: 28px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--navy);
    letter-spacing: 0.02em;
  }
  .v2 .v2-foot span { display: inline-flex; align-items: center; gap: 10px; }
  .v2 .v2-foot .sep {
    width: 4px; height: 4px;
    background: var(--muted-2);
    border-radius: 50%;
  }

  /* ============================================================
     V3 — DOCUMENT / LETTERHEAD
     Antetli kağıt hissi, ciddi resmi belge
     ============================================================ */
  .v3 {
    background: var(--white);
    color: var(--navy);
    padding: 80px;
    display: flex; flex-direction: column;
  }
  .v3 .v3-letter-top {
    background: var(--navy);
    margin: -80px -80px 0;
    padding: 48px 80px;
    color: white;
    display: flex; justify-content: space-between; align-items: center;
  }
  .v3 .v3-letter-brand {
    display: flex; align-items: center; gap: 18px;
  }
  .v3 .v3-letter-mark {
    width: 64px; height: 64px;
    border: 1.5px solid rgba(255,255,255,0.6);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-size: 38px;
    line-height: 1; padding-bottom: 6px;
  }
  .v3 .v3-letter-text {
    font-family: 'Instrument Serif', serif;
    font-size: 36px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .v3 .v3-letter-text small {
    display: block;
    font-family: 'Manrope', sans-serif;
    font-size: 12px; letter-spacing: 0.32em;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    margin-top: 8px;
    font-weight: 600;
  }
  .v3 .v3-letter-stamp {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.06em;
    text-align: right;
    line-height: 1.6;
  }
  .v3 .v3-letter-stamp strong {
    display: block;
    color: white;
    font-weight: 500;
    font-size: 14px;
  }

  .v3 .v3-letter-body {
    flex: 1;
    padding: 70px 0 40px;
    display: flex; flex-direction: column;
  }
  .v3 .v3-eyebrow {
    display: inline-block;
    background: var(--navy);
    color: white;
    padding: 10px 22px;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-weight: 700;
    align-self: flex-start;
    margin-bottom: 36px;
  }
  .v3 .v3-title {
    font-family: 'Instrument Serif', serif;
    font-size: 88px; line-height: 0.95;
    font-weight: 400;
    color: var(--navy);
    margin: 0 0 32px;
    letter-spacing: -0.03em;
    text-wrap: balance;
    max-width: 880px;
  }
  .v3 .v3-rule {
    width: 80px; height: 3px;
    background: var(--navy);
    margin-bottom: 32px;
  }
  .v3 .v3-body {
    font-size: 22px; line-height: 1.6;
    color: #2a2a2a;
    font-weight: 400;
    text-wrap: pretty;
    max-width: 840px;
  }

  .v3 .v3-letter-foot {
    background: var(--paper-2);
    margin: 0 -80px -80px;
    padding: 32px 80px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 32px;
  }
  .v3 .v3-letter-foot .lbl {
    font-size: 10px; letter-spacing: 0.32em;
    color: var(--muted);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .v3 .v3-letter-foot .val {
    font-size: 16px;
    color: var(--navy);
    font-weight: 600;
    line-height: 1.4;
  }

  /* ============================================================
     V4 — SPLIT LAYOUT
     Sol navy blok, sağ paper içerik — kurumsal asimetrik
     ============================================================ */
  .v4 {
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 1fr;
    background: var(--paper);
    height: 100%;
  }
  .v4 .v4-left {
    background: var(--navy);
    color: white;
    padding: 56px 32px;
    display: flex; flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .v4 .v4-left-top {
    width: 100%;
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 40px;
  }
  .v4 .v4-mark-big {
    width: 200px; height: 170px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
  }
  .v4 .v4-mark-big img {
    width: 100%; height: 100%; object-fit: contain;
    object-position: center;
  }
  .v4 .v4-left-rule {
    width: 60px; height: 1.5px;
    background: rgba(255,255,255,0.4);
    margin: 0 auto;
  }
  .v4 .v4-contact-stack {
    display: flex; flex-direction: column;
    justify-content: space-between;
    flex: 1;
    width: 100%;
    gap: 24px;
    padding: 8px 0;
  }
  .v4 .v4-contact-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px;
  }
  .v4 .v4-contact-item .ico {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
    box-shadow: none;
  }
  .v4 .v4-contact-item .ico svg {
    width: 22px; height: 22px;
    color: rgba(255,255,255,0.85);
    stroke-width: 1.8;
  }
  .v4 .v4-contact-item .lbl {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    font-weight: 500;
    font-style: italic;
  }
  .v4 .v4-contact-item .val {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 20px;
    color: white;
    font-weight: 400;
    line-height: 1.45;
    text-wrap: balance;
    max-width: 280px;
    white-space: pre-line;
    letter-spacing: 0.005em;
    font-variation-settings: "opsz" 24;
  }

  .v4 .v4-right {
    padding: 80px 70px;
    display: flex; flex-direction: column;
    background: var(--paper);
    height: 100%;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  .v4 .v4-right::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 220px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 220' preserveAspectRatio='none'><path d='M0,0 L1000,0 L1000,70 Q800,90 600,75 T200,85 T0,80 Z' fill='%230d1238' opacity='0.12'/><path d='M0,0 L1000,0 L1000,40 Q800,60 600,45 T200,55 T0,50 Z' fill='%230d1238' opacity='0.10'/><path d='M0,0 L1000,0 L1000,100 Q750,130 500,110 T0,115 Z' fill='%230d1238' opacity='0.08'/></svg>") no-repeat top center / 100% 220px;
    pointer-events: none;
    z-index: 0;
  }
  .v4 .v4-right::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 280px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 280' preserveAspectRatio='none'><path d='M0,180 Q150,140 300,170 T600,160 T1000,150 L1000,280 L0,280 Z' fill='%230d1238' opacity='0.08'/><path d='M0,210 Q150,180 300,200 T600,190 T1000,180 L1000,280 L0,280 Z' fill='%230d1238' opacity='0.10'/><path d='M0,240 Q200,220 400,235 T800,230 T1000,225 L1000,280 L0,280 Z' fill='%230d1238' opacity='0.12'/></svg>") no-repeat bottom center / 100% 280px;
    pointer-events: none;
    z-index: 0;
  }
  .v4 .v4-right > * { position: relative; z-index: 1; }
  .v4 .v4-right-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 50px;
  }
  .v4 .v4-eyebrow {
    font-size: 13px; letter-spacing: 0.4em;
    color: var(--navy);
    text-transform: uppercase;
    font-weight: 700;
    display: inline-flex; align-items: center; gap: 16px;
  }
  .v4 .v4-eyebrow::before,
  .v4 .v4-eyebrow::after {
    content: ''; display: inline-block;
    width: 32px; height: 1px;
    background: var(--navy);
  }
  .v4 .v4-meta {
    font-family: 'Fraunces', serif;
    text-align: right;
    font-size: 16px;
    color: var(--navy);
    line-height: 1.5;
    white-space: nowrap;
    font-weight: 500;
  }
  .v4 .v4-meta strong {
    display: block;
    font-family: 'Fraunces', serif;
    font-size: 30px;
    color: var(--navy);
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .v4 .v4-mid {
    flex: 1 1 auto;
    min-height: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 60px 0;
  }
  .v4 .v4-title {
    font-family: 'Fraunces', 'Instrument Serif', serif;
    font-size: 64px; line-height: 1.1;
    font-weight: 500;
    color: var(--navy);
    margin: 0 0 24px;
    letter-spacing: -0.02em;
    text-wrap: balance;
    font-variation-settings: "opsz" 144, "SOFT" 30, "wght" 500;
  }
  .v4 .v4-title em {
    font-style: normal;
    font-weight: 500;
    color: var(--navy);
  }
  .v4 .v4-subtitle {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 18px;
    line-height: 1.5;
    color: var(--navy);
    opacity: 0.65;
    margin: 0 0 40px;
    font-weight: 400;
    font-style: italic;
    text-wrap: balance;
    max-width: 92%;
    padding-bottom: 28px;
    border-bottom: 1px solid rgba(13, 18, 56, 0.18);
  }
  .v4 .v4-body {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 28px; line-height: 1.6;
    color: #1f2545;
    font-weight: 400;
    text-wrap: pretty;
    text-align: justify;
    hyphens: auto;
    text-indent: 2.2em;
  }

  .v4 .v4-bottom {
    margin-top: auto;
    margin-bottom: -70px;
    margin-right: -30px;
    padding-top: 0;
    border-top: none;
    display: flex;
    justify-content: flex-end;
  }
  .v4 .v4-sig-block {
    text-align: right;
    position: relative;
    padding-top: 28px;
  }
  .v4 .v4-sig-block::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 280px; height: 1px;
    background: linear-gradient(to left, var(--navy) 0%, var(--navy) 60%, transparent 100%);
    opacity: 0.5;
  }
  .v4 .v4-sig-name {
    font-family: 'Caveat', 'Brush Script MT', cursive;
    font-size: 48px;
    font-weight: 600;
    color: var(--navy);
    line-height: 1;
    letter-spacing: -0.01em;
    margin-bottom: 14px;
    transform: rotate(-2deg);
    transform-origin: right center;
    display: inline-block;
  }
  .v4 .v4-sig-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--navy);
    letter-spacing: 0.01em;
    font-style: italic;
  }

  /* Editable */
  [contenteditable="true"] { outline: none; cursor: text; }
  [contenteditable="true"]:focus {
    background: rgba(255, 220, 100, 0.18);
    box-shadow: 0 0 0 2px rgba(255, 220, 100, 0.4);
  }
  body.editing [contenteditable="true"]:hover {
    background: rgba(13, 18, 56, 0.04);
  }

  @media print {
    body { background: white; padding: 0; }
    .page-header, .util-row, .twk-panel, .hint { display: none !important; }
    .grid { display: block; }
    .variant-wrap { page-break-after: always; margin: 0; padding: 20mm; }
    .variant-label { display: none; }
    .card { width: 170mm; height: 170mm; box-shadow: none; margin: 0 auto; }
    .card-inner { transform: scale(0.157407); }
  }

  .util-row {
    max-width: 1200px; margin: 32px auto 0;
    display: flex; justify-content: center; gap: 12px;
    flex-wrap: wrap;
  }
  .util-btn {
    background: var(--navy); color: white; border: none;
    padding: 14px 28px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: 'Manrope', sans-serif;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .util-btn:hover { background: #000; }

  .hint {
    max-width: 1200px;
    margin: 0 auto 32px;
    padding: 16px 22px;
    background: white;
    color: var(--navy);
    font-size: 13px;
    font-weight: 500;
