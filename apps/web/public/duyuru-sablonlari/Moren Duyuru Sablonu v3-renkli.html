<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Moren — Duyuru Şablonu (Modern)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2470;
    --navy-deep: #0d1238;
    --lime: #d4ff3a;
    --coral: #ff6b4a;
    --sky: #b8d4ff;
    --mint: #c5f3d4;
    --butter: #ffe35c;
    --paper: #f5f3ee;
    --ink: #0f0f12;
    --muted: #6b6b6b;
    --soft: #ebe8e0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #ebe8e0;
    font-family: 'Manrope', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 48px 24px 120px;
  }

  .page-header { max-width: 1200px; margin: 0 auto 40px; text-align: center; }
  .page-header h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400; font-size: 44px;
    color: var(--navy-deep); margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  .page-header p {
    font-size: 14px; color: var(--muted); margin: 0;
    font-weight: 500;
  }

  .grid {
    max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 48px; justify-items: center;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }

  .variant-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .variant-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 500;
  }

  .card {
    width: 540px; height: 540px;
    position: relative; overflow: hidden;
    border-radius: 32px;
    box-shadow: 0 30px 60px -25px rgba(13, 18, 56, 0.25), 0 6px 12px rgba(0,0,0,0.04);
  }
  .card-inner {
    width: 1080px; height: 1080px;
    transform: scale(0.5); transform-origin: top left;
    position: absolute; inset: 0;
    border-radius: 64px;
    overflow: hidden;
  }

  /* ============ V1 — LIME PUNCH ============ */
  .v1 {
    background: var(--lime);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    padding: 80px;
    display: flex; flex-direction: column;
  }
  .v1 .v1-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 60px;
  }
  .v1 .v1-brand {
    display: flex; align-items: center; gap: 14px;
    font-family: 'Instrument Serif', serif;
    font-size: 38px;
    color: var(--navy-deep);
    letter-spacing: -0.02em;
  }
  .v1 .v1-mark {
    width: 60px; height: 60px;
    background: var(--navy-deep);
    color: var(--lime);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-size: 36px;
    line-height: 1;
    padding-bottom: 4px;
  }
  .v1 .v1-pill {
    background: var(--navy-deep);
    color: var(--lime);
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 16px; font-weight: 600;
    letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .v1 .v1-pill .dot {
    width: 8px; height: 8px;
    background: var(--lime);
    border-radius: 50%;
  }

  .v1 .v1-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; color: var(--navy-deep);
    font-weight: 500;
    margin-bottom: 30px;
    text-transform: lowercase;
    letter-spacing: 0;
  }
  .v1 .v1-title {
    font-family: 'Instrument Serif', serif;
    font-size: 110px; line-height: 0.95;
    font-weight: 400;
    color: var(--navy-deep);
    margin: 0 0 40px;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .v1 .v1-title em {
    font-style: italic; color: var(--navy-deep);
  }
  .v1 .v1-body {
    font-size: 24px; line-height: 1.5;
    color: var(--navy-deep);
    font-weight: 500;
    text-wrap: pretty;
    max-width: 800px;
    margin-bottom: auto;
  }

  .v1 .v1-foot {
    margin-top: 60px;
    background: var(--navy-deep);
    color: white;
    border-radius: 28px;
    padding: 28px 36px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 24px;
  }
  .v1 .v1-foot .foot-cell {
    display: flex; flex-direction: column;
    gap: 4px;
  }
  .v1 .v1-foot .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--lime);
    font-weight: 500;
  }
  .v1 .v1-foot .val {
    font-size: 17px; color: white;
    font-weight: 600;
  }

  /* ============ V2 — CORAL DOUBLE-CIRCLE ============ */
  .v2 {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    overflow: hidden;
  }
  .v2 .blob1 {
    position: absolute;
    top: -180px; right: -120px;
    width: 600px; height: 600px;
    background: var(--coral);
    border-radius: 50%;
  }
  .v2 .blob2 {
    position: absolute;
    bottom: -260px; left: -200px;
    width: 700px; height: 700px;
    background: var(--navy-deep);
    border-radius: 50%;
  }

  .v2 .v2-top {
    position: absolute; top: 80px; left: 80px; right: 80px;
    display: flex; justify-content: space-between; align-items: flex-start;
    z-index: 2;
  }
  .v2 .v2-brand {
    display: flex; align-items: center; gap: 14px;
    background: white;
    border-radius: 999px;
    padding: 14px 24px 14px 14px;
  }
  .v2 .v2-brand-mark {
    width: 52px; height: 52px;
    background: var(--navy-deep);
    color: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-size: 30px;
    padding-bottom: 4px;
    line-height: 1;
  }
  .v2 .v2-brand-text {
    font-family: 'Instrument Serif', serif;
    font-size: 28px; color: var(--navy-deep);
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .v2 .v2-brand-text small {
    display: block;
    font-family: 'Manrope', sans-serif;
    font-size: 11px; letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 4px;
    font-weight: 600;
  }
  .v2 .v2-date {
    background: white;
    border-radius: 999px;
    padding: 18px 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: var(--navy-deep);
    font-weight: 500;
  }

  .v2 .v2-content {
    position: absolute;
    top: 280px; left: 80px; right: 80px;
    z-index: 2;
  }
  .v2 .v2-eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--navy-deep);
    color: var(--coral);
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 36px;
  }
  .v2 .v2-eyebrow .dot {
    width: 8px; height: 8px;
    background: var(--coral);
    border-radius: 50%;
  }
  .v2 .v2-title {
    font-family: 'Instrument Serif', serif;
    font-size: 96px; line-height: 0.95;
    font-weight: 400;
    color: var(--navy-deep);
    margin: 0 0 32px;
    letter-spacing: -0.03em;
    text-wrap: balance;
    max-width: 880px;
  }
  .v2 .v2-body {
    font-size: 24px; line-height: 1.5;
    color: #2a2a2a;
    font-weight: 500;
    text-wrap: pretty;
    max-width: 820px;
  }

  .v2 .v2-foot {
    position: absolute;
    bottom: 80px; left: 80px; right: 80px;
    display: flex; gap: 14px;
    z-index: 2;
  }
  .v2 .v2-chip {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(20px);
    border-radius: 999px;
    padding: 18px 26px;
    font-size: 16px;
    color: var(--navy-deep);
    font-weight: 600;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 4px 16px rgba(13,18,56,0.08);
  }
  .v2 .v2-chip svg {
    width: 18px; height: 18px;
    color: var(--coral);
  }

  /* ============ V3 — STORY CARDS / NOTION ============ */
  .v3 {
    background: var(--sky);
    font-family: 'Manrope', sans-serif;
    color: var(--ink);
    padding: 80px;
    display: flex; flex-direction: column; gap: 32px;
  }
  .v3 .v3-row {
    display: flex; gap: 32px; align-items: stretch;
  }
  .v3 .v3-card {
    background: white;
    border-radius: 36px;
    padding: 40px;
  }
  .v3 .v3-card-brand {
    flex: 1.1;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .v3 .v3-mark-big {
    width: 130px; height: 130px;
    background: var(--navy-deep);
    color: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-size: 80px;
    line-height: 1;
    padding-bottom: 10px;
  }
  .v3 .v3-brand-name {
    font-family: 'Instrument Serif', serif;
    font-size: 56px;
    color: var(--navy-deep);
    line-height: 1;
    letter-spacing: -0.02em;
    margin-top: 24px;
  }
  .v3 .v3-brand-name small {
    display: block;
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: 8px;
    font-weight: 600;
  }
  .v3 .v3-card-date {
    flex: 0.9;
    background: var(--navy-deep);
    color: white;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .v3 .v3-tag {
    display: inline-flex;
    background: var(--lime);
    color: var(--navy-deep);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    align-self: flex-start;
  }
  .v3 .v3-date-big {
    font-family: 'Instrument Serif', serif;
    font-size: 64px;
    color: white;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .v3 .v3-date-big small {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--lime);
    margin-top: 12px;
    font-weight: 500;
  }

  .v3 .v3-card-main {
    flex: 1;
    background: white;
    padding: 50px;
  }
  .v3 .v3-title {
    font-family: 'Instrument Serif', serif;
    font-size: 76px; line-height: 0.95;
    font-weight: 400;
    color: var(--navy-deep);
    margin: 0 0 24px;
    letter-spacing: -0.025em;
    text-wrap: balance;
  }
  .v3 .v3-body {
    font-size: 22px; line-height: 1.5;
    color: #2a2a2a;
    font-weight: 500;
    text-wrap: pretty;
  }

  .v3 .v3-foot-row { display: flex; gap: 16px; }
  .v3 .v3-chip {
    flex: 1;
    background: white;
    border-radius: 28px;
    padding: 24px 28px;
  }
  .v3 .v3-chip .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; color: var(--muted);
    font-weight: 500;
    margin-bottom: 6px;
  }
  .v3 .v3-chip .val {
    font-size: 20px; color: var(--navy-deep);
    font-weight: 700;
  }

  /* ============ V4 — BUTTER MAGAZINE ============ */
  .v4 {
    background: var(--butter);
    font-family: 'Manrope', sans-serif;
    color: var(--ink);
    padding: 80px;
    display: flex; flex-direction: column;
  }
  .v4 .v4-top {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid var(--navy-deep);
    padding-bottom: 28px;
    margin-bottom: 50px;
  }
  .v4 .v4-brand {
    display: flex; align-items: center; gap: 16px;
  }
  .v4 .v4-mark {
    width: 64px; height: 64px;
    background: var(--navy-deep);
    color: var(--butter);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-size: 40px;
    padding-bottom: 6px;
    line-height: 1;
  }
  .v4 .v4-brand-text {
    font-family: 'Instrument Serif', serif;
    font-size: 42px;
    color: var(--navy-deep);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .v4 .v4-brand-text small {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--navy-deep);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  .v4 .v4-meta {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--navy-deep);
    line-height: 1.7;
  }
  .v4 .v4-meta strong {
    display: block;
    font-family: 'Instrument Serif', serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  .v4 .v4-eyebrow {
    background: var(--navy-deep);
    color: var(--butter);
    align-self: flex-start;
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 16px; font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 36px;
  }
  .v4 .v4-title {
    font-family: 'Instrument Serif', serif;
    font-size: 132px; line-height: 0.9;
    font-weight: 400;
    color: var(--navy-deep);
    margin: 0 0 36px;
    letter-spacing: -0.04em;
    text-wrap: balance;
  }
  .v4 .v4-title em { font-style: italic; }
  .v4 .v4-body {
    font-size: 24px; line-height: 1.5;
    color: var(--navy-deep);
    font-weight: 500;
    text-wrap: pretty;
    max-width: 820px;
    margin-bottom: auto;
  }

  .v4 .v4-foot {
    margin-top: 60px;
    border-top: 2px solid var(--navy-deep);
    padding-top: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 32px;
  }
  .v4 .v4-foot-cell .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--navy-deep);
    opacity: 0.6;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .v4 .v4-foot-cell .val {
    font-size: 18px;
    color: var(--navy-deep);
    font-weight: 700;
    line-height: 1.4;
  }

  /* Editable */
  [contenteditable="true"] { outline: none; cursor: text; }
  [contenteditable="true"]:focus {
    background: rgba(255, 255, 100, 0.3);
    box-shadow: 0 0 0 2px rgba(13, 18, 56, 0.3);
    border-radius: 4px;
  }
  body.editing [contenteditable="true"]:hover {
    background: rgba(13, 18, 56, 0.04);
    border-radius: 4px;
  }

  @media print {
    body { background: white; padding: 0; }
    .page-header, .util-row, .twk-panel, .hint { display: none !important; }
    .grid { display: block; }
    .variant-wrap { page-break-after: always; margin: 0; padding: 20mm; }
    .variant-label { display: none; }
    .card { width: 170mm; height: 170mm; box-shadow: none; margin: 0 auto; }
    .card-inner { transform: scale(0.157407); }
  }

  .util-row {
    max-width: 1200px; margin: 32px auto 0;
    display: flex; justify-content: center; gap: 12px;
    flex-wrap: wrap;
  }
  .util-btn {
    background: var(--navy-deep); color: white; border: none;
    padding: 14px 28px; font-size: 14px; font-weight: 600;
    border-radius: 999px;
    cursor: pointer; font-family: 'Manrope', sans-serif;
    transition: all 0.2s;
  }
  .util-btn:hover { background: #000; transform: translateY(-1px); }

  .hint {
    max-width: 1200px;
    margin: 0 auto 32px;
    padding: 18px 24px;
    background: white;
    border-radius: 16px;
    color: var(--navy-deep);
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 4px 12px rgba(13,18,56,0.05);
  }
  .hint strong { color: var(--navy-deep); font-weight: 700; }
</style>
</head>
<body>

<div class="page-header">
  <h1>Moren · Modern Duyuru Şablonu</h1>
  <p>4 cesur ve canlı varyasyon · 1080 × 1080 · WhatsApp uyumlu</p>
</div>

<div class="hint">
  <strong>İpucu:</strong> Tüm metinlere doğrudan tıklayıp düzenleyebilir, sağ üstteki Tweaks panelinden tek seferde tüm varyasyonları güncelleyebilirsiniz.
</div>

<div class="grid" id="grid"></div>

<div class="util-row">
  <button class="util-btn" onclick="window.print()">Yazdır / PDF</button>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="duyuru-app.jsx"></script>

</body>
</html>
